#
# Site configuration
#

name: Geras Contreras
description:
  es: "Doctorando en Derecho | Feminismo, cárceles y justicia"
  en: "PhD candidate in Law | Feminism, prisons and justice"

url: "https://geras-cr.github.io"
baseurl: ""

default_lang: es
languages:
  - es
  - en

footer-links:
  email: g.contrerasr@uniandes.edu.co

# Enter your Google Analytics web tracking code (e.g. UA-2110908-2) to activate tracking
google_analytics:

# Every content page sets its own explicit `permalink:` in front matter.

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: 'highlight'

sass:
  style: :expanded

plugins:
  - jekyll-sitemap
  - jekyll-feed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - CV_GCR_2026.docx
  - vendor
  - node_modules
